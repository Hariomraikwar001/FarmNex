<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
  content="width=device-width, initial-scale=1.0">

  <title>Register</title>

  <style>

    body{

      margin:0;
      font-family:Arial;
      background:#f5f5f5;

      display:flex;
      justify-content:center;
      align-items:center;

      height:100vh;

    }

    .container{

      background:white;
      padding:40px;
      border-radius:15px;

      width:350px;

      box-shadow:0 0 10px rgba(0,0,0,0.1);

      text-align:center;

    }

    h1{

      color:green;

    }

    input, select{

      width:100%;
      padding:12px;
      margin:10px 0;

      border-radius:8px;
      border:1px solid #ccc;

    }

    button{

      width:100%;
      padding:12px;

      background:green;
      color:white;

      border:none;
      border-radius:8px;

      font-size:16px;
      cursor:pointer;

      margin-top:10px;

    }

  </style>

</head>

<body>

<div class="container">

  <h1>🌱 Register</h1>

  <input
  type="text"
  placeholder="Full Name">

  <input
  type="email"
  placeholder="Email">

  <input
  type="password"
  placeholder="Password">

  <select>

    <option>Farmer</option>
    <option>Consumer</option>

  </select>

  <button onclick="registerUser()">

    Register

  </button>

</div>

<script>

function registerUser(){

  alert("Registration Successful");

  window.location.href =
  "./login.html";

}

</script>

</body>
</html>
