<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Login</title>
</head>

<body>

  <h1>Login / Signup</h1>

  <input
    type="email"
    id="email"
    placeholder="Enter Email"
  >

  <input
    type="password"
    id="password"
    placeholder="Enter Password"
  >

  <button id="signupBtn">
    Signup
  </button>

  <button id="loginBtn">
    Login
  </button>

  <script type="module" src="./login.js"></script>

</body>
</html>
