<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Tracking</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

<header>
  <h1>📦 Order Tracking</h1>
</header>

<div class="container">

  <div class="card">
    <h2>Track Order</h2>

    <p>✅ Order Placed</p>
    <p>✅ Farmer Accepted</p>
    <p>✅ Packed</p>
    <p>🚚 Out for Delivery</p>
    <p>⏳ ETA: 20 Minutes</p>
  </div>

  <div class="card">
    <h2>Rate Farmer</h2>

    <select>
      <option>⭐ 1</option>
      <option>⭐ 2</option>
      <option>⭐ 3</option>
      <option>⭐ 4</option>
      <option>⭐ 5</option>
    </select>

    <button>Submit Rating</button>
  </div>

</div>

<script src="tracking.js"></script>
</body>
</html>
