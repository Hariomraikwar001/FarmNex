<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
  content="width=device-width, initial-scale=1.0">

  <title>Products</title>

  <style>

    body{

      margin:0;
      font-family:Arial;
      background:#f5f5f5;

    }

    .navbar{

      background:green;
      color:white;
      padding:15px 20px;

      display:flex;
      justify-content:space-between;
      align-items:center;

    }

    .navbar h1{

      margin:0;

    }

    .navbar a{

      color:white;
      text-decoration:none;
      margin-left:15px;
      font-weight:bold;

    }

    .products-container{

      display:flex;
      flex-wrap:wrap;
      gap:20px;
      justify-content:center;
      padding:20px;

    }

    .card{

      width:280px;
      background:white;
      padding:15px;
      border-radius:12px;
      box-shadow:0 0 10px rgba(0,0,0,0.1);

    }

    .product-image{

      width:100%;
      height:180px;
      object-fit:cover;
      border-radius:10px;

    }

    .price{

      font-size:20px;
      color:green;
      font-weight:bold;

    }

    .stock{

      color:#555;

    }

    .alert{

      color:red;
      font-weight:bold;

    }

    button{

      background:green;
      color:white;
      border:none;
      padding:10px;
      border-radius:6px;
      cursor:pointer;
      width:100%;
      margin-top:10px;
      font-size:16px;

    }

  </style>

</head>

<body>

<nav class="navbar">

  <h1>🛒 FarmNex Marketplace</h1>

  <div>

    <a href="../consumer/cart.html">
      Cart
    </a>

    <a href="../farmer/dashboard.html">
      Dashboard
    </a>

  </div>

</nav>

<div
id="products"
class="products-container">

</div>

<script type="module"
src="./products.js"></script>

</body>
</html>
